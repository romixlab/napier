[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/romixlab/napier"

[workspace.dependencies]
pest = "2.8"
pest_derive = "2.8"
serde = { version = "1", features = ["derive"] }
float-cmp = "0.10"
serde_json = "1.0.154"
si_dynamic = { path = "crates/si_dynamic", version = "0.3.0" }
